<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu — XaaS.vn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1120; --ink-soft:#4A5268;
    --paper:#FFFFFF; --surface:#F3F5FC; --surface-line:#E5E8F5;
    --iaas:#2454FF; --paas:#7B3FF2; --ai-2:#FF3D81;
    --danger:#E63946; --danger-soft:#FCE9EA; --ok:#0FA968; --ok-soft:#E4F9EF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;border-radius:20px;padding:40px;max-width:400px;width:100%;box-shadow:0 30px 60px -30px rgba(11,17,32,0.25);}
  .logo{display:flex;align-items:center;gap:9px;font-family:'Be Vietnam Pro',sans-serif;font-weight:900;font-size:19px;margin-bottom:26px;}
  .logo .dot-x{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--iaas),var(--paas) 55%,var(--ai-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
  h1{font-family:'Be Vietnam Pro',sans-serif;font-size:22px;margin:0 0 8px;}
  p.sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
  .field input{width:100%;border:1px solid var(--surface-line);border-radius:10px;padding:12px 14px;font-size:14px;box-sizing:border-box;}
  button{width:100%;background:var(--ink);color:#fff;padding:13px;border-radius:11px;font-weight:700;font-size:14.5px;border:none;cursor:pointer;font-family:inherit;}
  button:hover{background:#1a2340;}
  .msg{border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;}
  .msg.err{background:var(--danger-soft);color:var(--danger);}
  .msg.ok{background:var(--ok-soft);color:var(--ok);}
  .msg.on{display:block;}
  a{color:var(--iaas);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="dot-x">X</span>XaaS.vn</div>
    <div id="formView">
      <h1>Đặt lại mật khẩu</h1>
      <p class="sub">Nhập mật khẩu mới cho tài khoản của bạn.</p>
      <div class="msg err" id="err"></div>
      <div class="field"><label>Mật khẩu mới</label><input type="password" id="p1" placeholder="Tối thiểu 6 ký tự"></div>
      <div class="field"><label>Xác nhận mật khẩu mới</label><input type="password" id="p2" placeholder="Nhập lại mật khẩu mới"></div>
      <button onclick="doReset()">Đặt lại mật khẩu →</button>
    </div>
    <div id="doneView" style="display:none;">
      <div class="msg ok on" id="doneMsg"></div>
      <p class="sub" style="margin-top:0;"><a href="auth.html">← Quay lại đăng nhập</a></p>
    </div>
  </div>

<script>
  const token = new URLSearchParams(location.search).get('token');
  if(!token){
    document.getElementById('formView').innerHTML = `<h1>Link không hợp lệ</h1><p class="sub">Thiếu mã đặt lại mật khẩu. Vui lòng dùng đúng link được gửi qua email, hoặc yêu cầu lại từ trang đăng nhập.</p><p><a href="auth.html">← Quay lại đăng nhập</a></p>`;
  }

  async function doReset(){
    const err = document.getElementById('err');
    err.classList.remove('on');
    const p1 = document.getElementById('p1').value;
    const p2 = document.getElementById('p2').value;
    if(p1.length < 6){ err.textContent = 'Mật khẩu cần tối thiểu 6 ký tự.'; err.classList.add('on'); return; }
    if(p1 !== p2){ err.textContent = 'Mật khẩu xác nhận không khớp.'; err.classList.add('on'); return; }

    const res = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, newPassword: p1 }),
    });
    const body = await res.json().catch(()=>null);
    if(!res.ok){
      err.textContent = (body && body.error) || 'Không thể đặt lại mật khẩu, vui lòng thử lại.';
      err.classList.add('on');
      return;
    }
    document.getElementById('formView').style.display = 'none';
    document.getElementById('doneView').style.display = 'block';
    document.getElementById('doneMsg').textContent = body.message;
  }
</script>
</body>
</html>
