name = "xaas-vn"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"                     # accessed in Functions as env.DB
database_name = "xaas_vn_db"
database_id = "8bb5c056-7596-4b9e-a01b-6a6e30cec886"

[[r2_buckets]]
binding = "LOGOS"                  # accessed in Functions as env.LOGOS
bucket_name = "xaas-vn-logos"

# Secret used by /api/auth/bootstrap-admin to create the very first
# admin account. Set with:
#   wrangler pages secret put ADMIN_BOOTSTRAP_SECRET
# Do NOT commit a real value here.
[vars]
ADMIN_BOOTSTRAP_SECRET = "1234zxcv"

# Optional — for real password-reset emails via https://resend.com.
# Without these, forgot-password still works (token is created) but no
# email is actually sent. Set with:
#   wrangler pages secret put RESEND_API_KEY
#   wrangler pages secret put EMAIL_FROM   (e.g. "XaaS.vn <no-reply@xaas.vn>")
